  WHISPERX_JA_ALIGN_REVISION: ${WHISPERX_JA_ALIGN_REVISION:-2785e99ab97df77a32b5bd0ece5c9fa188a02f19}
  WHISPERX_JA_REQUIRE_SAFETENSORS: ${WHISPERX_JA_REQUIRE_SAFETENSORS:-true}
  WHISPERX_ALIGNMENT_FAILURE_MODE: ${WHISPERX_ALIGNMENT_FAILURE_MODE:-fallback}
  HF_HOME: ${HF_HOME:-/app/storage/models/huggingface}
  TORCH_HOME: ${TORCH_HOME:-/app/storage/models/torch}
  XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/app/storage/models/cache}
  HF_TOKEN: ${HF_TOKEN:-}
  TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-routed}
  LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
  LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
  TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-30}
  LOCAL_MT_MODEL: ${LOCAL_MT_MODEL:-facebook/nllb-200-distilled-600M}
  LOCAL_MT_MODEL_REVISION: ${LOCAL_MT_MODEL_REVISION:-b3bbac6cd67efa90e0fcbe4c882ec79cfd782a17}
  LOCAL_MT_REQUIRE_SAFETENSORS: ${LOCAL_MT_REQUIRE_SAFETENSORS:-true}
  LOCAL_MT_MODEL_DIR: ${LOCAL_MT_MODEL_DIR:-/app/storage/models/nllb-200-distilled-600M-ct2}
  LOCAL_MT_TOKENIZER_DIR: ${LOCAL_MT_TOKENIZER_DIR:-/app/storage/models/nllb-200-distilled-600M-tokenizer}
  LOCAL_MT_DEVICE: ${LOCAL_MT_DEVICE:-cpu}
  LOCAL_MT_COMPUTE_TYPE: ${LOCAL_MT_COMPUTE_TYPE:-int8}
  LOCAL_MT_BATCH_SIZE: ${LOCAL_MT_BATCH_SIZE:-4}
  LOCAL_MT_BEAM_SIZE: ${LOCAL_MT_BEAM_SIZE:-4}
  LOCAL_MT_MAX_INPUT_TOKENS: ${LOCAL_MT_MAX_INPUT_TOKENS:-512}
  LOCAL_MT_TOKENIZER_CACHE_SIZE: ${LOCAL_MT_TOKENIZER_CACHE_SIZE:-8}
  TRANSLATION_DEFAULT_PROVIDER: ${TRANSLATION_DEFAULT_PROVIDER:-hy-mt2}
  TRANSLATION_ROUTE_OVERRIDES: ${TRANSLATION_ROUTE_OVERRIDES:-}
  HY_MT_BASE_URL: ${HY_MT_BASE_URL:-http://host.docker.internal:5002/v1}
  HY_MT_API_KEY: ${HY_MT_API_KEY:-}
  HY_MT_MODEL: ${HY_MT_MODEL:-Hy-MT2-7B}
  HY_MT_TIMEOUT_SECONDS: ${HY_MT_TIMEOUT_SECONDS:-60}
  HY_MT_TEMPERATURE: ${HY_MT_TEMPERATURE:-0.7}
  HY_MT_TOP_P: ${HY_MT_TOP_P:-0.6}
  HY_MT_TOP_K: ${HY_MT_TOP_K:-20}
  HY_MT_REPETITION_PENALTY: ${HY_MT_REPETITION_PENALTY:-1.05}
  HY_MT_MAX_TOKENS: ${HY_MT_MAX_TOKENS:-256}
  HY_MT_CONTEXT_CAPTIONS: ${HY_MT_CONTEXT_CAPTIONS:-2}
  HY_MT_RETRIES: ${HY_MT_RETRIES:-1}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
  LLM_RETRIES: ${LLM_RETRIES:-1}
  LLM_JSON_MODE: ${LLM_JSON_MODE:-false}
  TRANSLATION_UNIT_MAX_SECONDS: ${TRANSLATION_UNIT_MAX_SECONDS:-12}
  SOURCE_RECONSTRUCTION_MAX_GAP_SECONDS: ${SOURCE_RECONSTRUCTION_MAX_GAP_SECONDS:-0.2}
  SOURCE_RECONSTRUCTION_MAX_FRAGMENT_CHARS: ${SOURCE_RECONSTRUCTION_MAX_FRAGMENT_CHARS:-2}
  SOURCE_REVIEW_CONFIDENCE_THRESHOLD: ${SOURCE_REVIEW_CONFIDENCE_THRESHOLD:-0.45}
  CAPTION_MAX_DURATION_SECONDS: ${CAPTION_MAX_DURATION_SECONDS:-6}
  CAPTION_MAX_CHARS: ${CAPTION_MAX_CHARS:-84}
  CAPTION_LINE_CHARS: ${CAPTION_LINE_CHARS:-42}
  CAPTION_PAUSE_SECONDS: ${CAPTION_PAUSE_SECONDS:-0.65}
  DIAGNOSTICS_TIMEOUT_SECONDS: ${DIAGNOSTICS_TIMEOUT_SECONDS:-2}
  DIAGNOSTICS_DEEP_CACHE_TTL_SECONDS: ${DIAGNOSTICS_DEEP_CACHE_TTL_SECONDS:-300}
  WORKER_PING_TIMEOUT_SECONDS: ${WORKER_PING_TIMEOUT_SECONDS:-2}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
  WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-15}
  WORKER_HEARTBEAT_KEY_PREFIX: ${WORKER_HEARTBEAT_KEY_PREFIX:-subtitled:workers:heartbeat:}
  MIN_FREE_STORAGE_BYTES: ${MIN_FREE_STORAGE_BYTES:-1073741824}

x-backend-volumes: &backend-volumes
  - ./backend:/app
  - ./backend/storage:/app/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtitled}
      POSTGRES_USER: ${POSTGRES_USER:-subtitle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subtitle}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subtitle} -d ${POSTGRES_DB:-subtitled}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_UPDATE_MODELS: ${LIBRETRANSLATE_UPDATE_MODELS:-true}
    ports:
      - "5001:5000"
    volumes:
      - libretranslate-data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)\""]
      interval: 10s
      timeout: 10s
      start_period: ${LIBRETRANSLATE_START_PERIOD:-30m}
      retries: 30

  backend:
    image: subtitled-backend:dev
    build:
      context: ./backend
    command: flask --app run run --debug --host 0.0.0.0 --port 5000
    environment:
      <<: *backend-environment
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started

  worker:
    image: subtitled-backend:dev
    command: celery -A celery_worker.celery_app worker --loglevel=info -P solo
    environment: *backend-environment
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started

  frontend:
    image: subtitled-frontend:dev
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  libretranslate-data:
  frontend-node-modules:
