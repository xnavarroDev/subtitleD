x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://subtitle:subtitle@postgres:5432/subtitled}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  WHISPER_MODEL_DIR: ${WHISPER_MODEL_DIR:-/app/storage/models}
  WHISPERX_BATCH_SIZE: ${WHISPERX_BATCH_SIZE:-16}
  WHISPERX_DIARIZE: ${WHISPERX_DIARIZE:-true}
  HF_HOME: ${HF_HOME:-/app/storage/models/huggingface}
  TORCH_HOME: ${TORCH_HOME:-/app/storage/models/torch}
  XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/app/storage/models/cache}
  HF_TOKEN: ${HF_TOKEN:-}
  TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
  LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
  LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
  TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-30}
  CONTEXTUAL_TRANSLATION_PROVIDER: ${CONTEXTUAL_TRANSLATION_PROVIDER:-openai-compatible}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-256}
  TRANSLATION_WINDOW_SECONDS: ${TRANSLATION_WINDOW_SECONDS:-12}
  TRANSLATION_LOOKAHEAD_SECONDS: ${TRANSLATION_LOOKAHEAD_SECONDS:-3}
  TRANSLATION_CONTEXT_CAPTIONS: ${TRANSLATION_CONTEXT_CAPTIONS:-2}
  CAPTION_MAX_DURATION_SECONDS: ${CAPTION_MAX_DURATION_SECONDS:-6}
  CAPTION_MAX_CHARS: ${CAPTION_MAX_CHARS:-84}
  CAPTION_LINE_CHARS: ${CAPTION_LINE_CHARS:-42}
  CAPTION_PAUSE_SECONDS: ${CAPTION_PAUSE_SECONDS:-0.65}
  DIAGNOSTICS_TIMEOUT_SECONDS: ${DIAGNOSTICS_TIMEOUT_SECONDS:-2}
  DIAGNOSTICS_DEEP_CACHE_TTL_SECONDS: ${DIAGNOSTICS_DEEP_CACHE_TTL_SECONDS:-300}
  WORKER_PING_TIMEOUT_SECONDS: ${WORKER_PING_TIMEOUT_SECONDS:-2}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
  WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-15}
  WORKER_HEARTBEAT_KEY_PREFIX: ${WORKER_HEARTBEAT_KEY_PREFIX:-subtitled:workers:heartbeat:}
  MIN_FREE_STORAGE_BYTES: ${MIN_FREE_STORAGE_BYTES:-1073741824}

x-backend-volumes: &backend-volumes
  - ./backend:/app
  - ./backend/storage:/app/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtitled}
      POSTGRES_USER: ${POSTGRES_USER:-subtitle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subtitle}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subtitle} -d ${POSTGRES_DB:-subtitled}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_UPDATE_MODELS: ${LIBRETRANSLATE_UPDATE_MODELS:-true}
    ports:
      - "5001:5000"
    volumes:
      - libretranslate-data:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)\""]
      interval: 10s
      timeout: 10s
      start_period: ${LIBRETRANSLATE_START_PERIOD:-30m}
      retries: 30

  backend:
    image: subtitled-backend:dev
    build:
      context: ./backend
    command: flask --app run run --debug --host 0.0.0.0 --port 5000
    environment:
      <<: *backend-environment
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started

  worker:
    image: subtitled-backend:dev
    command: celery -A celery_worker.celery_app worker --loglevel=info -P solo
    environment: *backend-environment
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_started

  frontend:
    image: subtitled-frontend:dev
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  libretranslate-data:
  frontend-node-modules:
