name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check backend dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall app tests

      - name: Run backend tests
        run: python -m pytest

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    env:
      TRANSLATION_PROVIDER: mock
      WHISPERX_DIARIZE: "false"
      WORKER_PING_TIMEOUT_SECONDS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start database and Redis
        run: docker compose up -d --wait postgres redis

      - name: Start backend without worker
        run: >-
          docker compose run -d --no-deps --service-ports
          --name subtitled-ci-backend backend

      - name: Wait for backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify diagnostics fail when worker is absent
        run: |
          status=$(curl --silent --output /tmp/diagnostics.json \
            --write-out "%{http_code}" http://localhost:5000/api/diagnostics)
          cat /tmp/diagnostics.json
          test "$status" = "503"
          grep --quiet "No Celery worker responded" /tmp/diagnostics.json

      - name: Start worker
        run: >-
          docker compose run -d --no-deps
          --name subtitled-ci-worker worker

      - name: Verify live diagnostics pass
        run: |
          for attempt in {1..30}; do
            status=$(curl --silent --output /tmp/diagnostics.json \
              --write-out "%{http_code}" http://localhost:5000/api/diagnostics)
            if [ "$status" = "200" ]; then
              cat /tmp/diagnostics.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/diagnostics.json
          exit 1

      - name: Show integration logs on failure
        if: failure()
        run: |
          docker logs subtitled-ci-backend || true
          docker logs subtitled-ci-worker || true
          docker compose logs postgres redis || true

      - name: Stop integration stack
        if: always()
        run: |
          docker rm --force subtitled-ci-backend subtitled-ci-worker || true
          docker compose down --volumes --remove-orphans

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
