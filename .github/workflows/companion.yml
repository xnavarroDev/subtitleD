name: Build Windows companion preview

# Builds reviewable artifacts only. It does not create a release or deploy a site.
on:
  workflow_dispatch:
    inputs:
      prebuilt_processing:
        description: Publish a processing image to GHCR and include its immutable digest
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  processing-image:
    if: inputs.prebuilt_processing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/connector" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: reference
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

  windows:
    needs: processing-image
    if: always() && (needs.processing-image.result == 'success' || needs.processing-image.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/companion-requirements.txt pytest==8.3.3
      - run: python -m pytest backend/tests/test_connector_launcher.py backend/tests/test_companion.py -q
      - name: Build companion and installer
        shell: pwsh
        env:
          PROCESSING_IMAGE: ${{ needs.processing-image.outputs.image }}
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compilerPath = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $compilerPath)) { throw "Inno Setup compiler is missing from this runner." }
          $buildArgs = @('packaging/build_companion.py', '--iscc', $compilerPath)
          if ($env:PROCESSING_IMAGE) { $buildArgs += @('--image', $env:PROCESSING_IMAGE) }
          python @buildArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check bundled runtime
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'companion-self-test'
          $process = Start-Process -FilePath './dist/companion/SubtitleD-Companion/SubtitleD-Companion.exe' -ArgumentList @('--home', "`"$testHome`"", '--self-test') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed" }
          $result = Get-Content (Join-Path $testHome 'self-test.json') | ConvertFrom-Json
          if (-not $result.ok -or -not $result.packaged) { throw "Bundled runtime check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleD-Companion-Windows
          path: |
            dist/companion/*.exe
            dist/companion/*.zip
            dist/companion/SHA256SUMS.txt
